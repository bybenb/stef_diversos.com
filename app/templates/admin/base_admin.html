<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stef Admin - Painel</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Cores da marca */
        :root { --rosa-principal: #b74265; }
        .bg-stef { background-color: var(--rosa-principal); }
        .text-stef { color: var(--rosa-principal); }

        /* Navbar superior */
        .navbar-custom { background-color: var(--rosa-principal); }

        /* Sidebar Desktop fixa */
        @media (min-width: 768px) {
            .sidebar-desktop {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 240px;
                padding-top: 70px; /* Espaço para a navbar */
                background-color: #f8f9fa;
                border-right: 1px solid #dee2e6;
                z-index: 1000;
            }
            .main-content { margin-left: 240px; padding-top: 20px; }
        }

        /* Ajuste para mobile */
        @media (max-width: 767px) {
            .main-content { padding-top: 20px; padding-left: 15px; padding-right: 15px; }
        }

        .sidebar-link { padding: 10px 20px; display: block; color: #333; text-decoration: none; transition: 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background-color: var(--rosa-principal); color: white; }
    </style>
</head>
<body>

    <!-- Navbar Superior (Mobile e Desktop) -->
    <nav class="navbar navbar-custom navbar-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <!-- Botão Menu Hambúrguer (Só aparece no celular) -->
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile" aria-controls="sidebarMobile">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <span class="navbar-brand mb-0 h1 ms-2 d-flex align-items-center">
                <img src="/static/img/logo.png" alt="Stef Logo" height="35" class="me-2">
                Stef Admin
            </span>
        </div>
    </nav>

    <!-- Sidebar Offcanvas (Apenas Mobile) -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="sidebarMobile">
        <div class="offcanvas-header " style="background-color: #b74265;">
            <h5 class="offcanvas-title">
                <span class="navbar-brand mb-0 h1 ms-2 d-flex align-items-center">
                    <img src="/static/img/logo.png" alt="Stef Logo" height="35" class="me-2">
                    Stef Admin
                </span>

            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <nav class="nav flex-column">
                <a class="sidebar-link {% if request.url.path == '/admin/dashboard' %}active{% endif %}" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a class="sidebar-link {% if request.url.path == '/admin/produtos' %}active{% endif %}" href="/admin/produtos"><i class="bi bi-box me-2"></i> Produtos</a>
                <a class="sidebar-link {% if request.url.path == '/admin/produtos/novo' %}active{% endif %}" href="/admin/produtos/novo"><i class="bi bi-plus-circle me-2"></i> Adicionar Produto</a>
                <a class="sidebar-link {% if '/admin/pedidos' in request.url.path %}active{% endif %}" href="/admin/pedidos"><i class="bi bi-cart me-2"></i> Pedidos</a>
                <hr>
                <a class="sidebar-link text-danger" href="/admin/logout"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
            </nav>
        </div>
    </div>

    <!-- Sidebar Fixa (Apenas Desktop) -->
    <div class="sidebar-desktop d-none d-md-block">
        <nav class="nav flex-column pt-4">
            <a class="sidebar-link {% if request.url.path == '/admin/dashboard' %}active{% endif %}" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="sidebar-link {% if request.url.path == '/admin/produtos' %}active{% endif %}" href="/admin/produtos"><i class="bi bi-box me-2"></i> Produtos</a>
            <a class="sidebar-link {% if request.url.path == '/admin/produtos/novo' %}active{% endif %}" href="/admin/produtos/novo"><i class="bi bi-plus-circle me-2"></i> Adicionar Produto</a>
            <a class="sidebar-link {% if '/admin/pedidos' in request.url.path %}active{% endif %}" href="/admin/pedidos"><i class="bi bi-cart me-2"></i> Pedidos</a>
            <hr>
            <a class="sidebar-link text-danger" href="/admin/logout"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
        </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content container-fluid p-3">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
