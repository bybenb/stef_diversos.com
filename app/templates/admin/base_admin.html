<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stef Admin - Painel de Controle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #b74265; color: white; }
        .sidebar a { color: white; text-decoration: none; padding: 15px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar a:hover { background-color: #d85e85; }
        .sidebar .active { background-color: #d4af37; color: #333; }
        .card-dashboard { border-left: 5px solid #b74265; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center" style="background: #d4af37; color: #333;">
                    <h3>Stef Admin</h3>
                </div>
                <a href="/admin/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                <a href="/admin/produtos"><i class="fas fa-box"></i> Produtos</a>
                <a href="/admin/pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</a>
                <a href="#" id="logout-link" class="text-danger"><i class="fas fa-sign-out-alt"></i> Sair</a>
            </div>

            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% if clerk_publishable_key and clerk_fapi_url %}
    <script
        defer
        crossorigin="anonymous"
        src="https://{{ clerk_fapi_url }}/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript"
    ></script>
    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="{{ clerk_publishable_key }}"
        src="https://{{ clerk_fapi_url }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript"
    ></script>
    <script>
        window.addEventListener('load', async function () {
            await Clerk.load({
                ui: { ClerkUI: window.__internal_ClerkUICtor },
            });

            if (!Clerk.user) {
                window.location.href = '/admin/login';
                return;
            }

            document.getElementById('logout-link').addEventListener('click', async function (event) {
                event.preventDefault();
                await Clerk.signOut();
                window.location.href = '/admin/login';
            });
        });
    </script>
    {% endif %}
</body>
</html>
