<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Stef Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #b74265; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        .card { 
            width: 400px; 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center mb-4">
            <h3 style="color: #b74265; font-weight: bold;">Stef Admin</h3>
            <p class="text-muted">Acesse o painel de controle</p>
        </div>
        
        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail autorizado</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required placeholder="••••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background-color: #b74265; border: none;">
                Entrar
            </button>
        </form>
        <div class="mt-3 text-center text-muted small">
            Apenas e-mails autorizados têm acesso.
        </div>
    </div>
</body>
</html>
