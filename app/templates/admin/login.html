<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Stef Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <style>
        body {
            background-color: #b74265;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            color: #fff;
            margin-bottom: 1.5rem;
        }

        .login-header h3 {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            margin: 0;
            opacity: 0.9;
        }

        #clerk-sign-in {
            width: 100%;
        }

        #clerk-sign-in > div {
            width: 100% !important;
            margin: 0 auto;
        }

        .loading-text {
            color: #fff;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-header text-center">
            <h3>Stef Admin</h3>
            <p>Acesse o painel com sua conta Google</p>
        </div>

        <div id="clerk-sign-in">
            <p class="loading-text">Carregando opções de login...</p>
        </div>
    </div>

    {% if clerk_publishable_key and clerk_fapi_url %}
    <script
        defer
        crossorigin="anonymous"
        src="https://{{ clerk_fapi_url }}/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript"
    ></script>
    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="{{ clerk_publishable_key }}"
        src="https://{{ clerk_fapi_url }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript"
    ></script>
    <script>
        window.addEventListener('load', async function () {
            try {
                await Clerk.load({
                    ui: { ClerkUI: window.__internal_ClerkUICtor },
                });

                if (Clerk.user) {
                    window.location.href = '/dashboard';
                    return;
                }

                const signInElement = document.getElementById('clerk-sign-in');
                signInElement.innerHTML = '';
                Clerk.mountSignIn(signInElement, {
                    afterSignInUrl: '/dashboard',
                    forceRedirectUrl: '/dashboard',
                });
            } catch (err) {
                console.error('Erro ao carregar Clerk:', err);
                document.getElementById('clerk-sign-in').innerHTML =
                    '<div class="alert alert-danger">Erro ao carregar Clerk. Verifique o console.</div>';
            }
        });
    </script>
    {% else %}
    <script>
        document.getElementById('clerk-sign-in').innerHTML =
            '<div class="alert alert-danger">Configure CLERK_PUBLISHABLE_KEY no arquivo .env</div>';
    </script>
    {% endif %}

</body>
</html>
