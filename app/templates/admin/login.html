<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Stef Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #b74265; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        .card { 
            width: 400px; 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
        }
        #clerk-sign-in {
            min-height: 300px; /* Garante espaço para o componente */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-text {
            color: #b74265;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card text-center">
        <div class="mb-4">
            <h3 style="color: #b74265; font-weight: bold;">Stef Admin</h3>
            <p class="text-muted">Acesse o painel com sua conta Google</p>
        </div>
        
        <!-- Área onde o Clerk vai montar o componente -->
        <div id="clerk-sign-in">
            <p class="loading-text">Carregando opções de login...</p>
        </div>
    </div>

    <!-- Scripts do Clerk -->
    <!-- ATENÇÃO: Substitua 'pk_test_...' pela sua PUBLISHABLE KEY do Clerk -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
    <script src="login_clerk.js" ></script>

</body>
</html>
