{% extends "admin/base_admin.html" %}

{% block content %}
<div class="card bg-white shadow-sm">
    <div class="card-header bg-light">
        <h4>{{ titulo }}</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nome do Produto</label>
                    <input type="text" name="nome" class="form-control" value="{{ produto.nome if produto else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Categoria</label>
                    <select name="categoria_id" class="form-control">
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if produto and produto.categoria_id == cat.id %}selected{% endif %}>
                            {{ cat.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco if produto else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Estoque</label>
                    <input type="number" name="estoque" class="form-control" value="{{ produto.estoque if produto else 0 }}" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label>URL da Imagem</label>
                    <input type="text" name="url_imagem" class="form-control" value="{{ produto.url_imagem if produto else '' }}" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label>Descrição</label>
                    <textarea name="descricao" class="form-control" rows="3">{{ produto.descricao if produto else '' }}</textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
            <a href="/admin/produtos" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
