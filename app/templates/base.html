<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stef Diversos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/estilo.css">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand text-white" href="/">Stef <span>Diversos</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Bolsas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Perfumes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Relogios</a></li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-stef-gold rounded-circle position-relative" href="/carrinho">
                            <i class="bi bi-cart-fill"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
                                0
                            </span>
                        </a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="btn btn-outline-light rounded-circle" href="/admin/login">
                            <i class="bi bi-person-fill"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <main>
        {% block content %}{% endblock %}
    </main>

    
    <footer>
        <div class="container text-center">
            <h5 class="text-white">Stef <span class="gold-text">Diversos</span></h5>
            <p class="mb-0">Moda, Beleza e Estilo para o seu dia a dia.</p>
            <div class="mt-3">
                <i  onclick="window.open('https://www.instagram.com/stef_diversos/')" class="bi bi-instagram fs-4 mx-2"></i>
                <i onclick="window.open('https://www.facebook.com/214661418392658?ref=stef_diversos_website')"   class="bi bi-facebook fs-4 mx-2"></i>
                <i class="bi bi-whatsapp fs-4 mx-2"></i>
            </div>
            <hr class="border-secondary w-50 mx-auto">
            <small>&copy; 2026 Stef Diversos - Todos os direitos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function atualizarCarrinho() {
            const response = await fetch('/api/carrinho/contador');
            const data = await response.json();
            document.getElementById('cart-count').textContent = data.total_itens;
        }
        
        document.addEventListener('DOMContentLoaded', atualizarCarrinho);


        async function adicionarAoCarrinho(produtoId) {
        const qtdInput = document.getElementById('qtd-input');
        const quantidade = qtdInput ? parseInt(qtdInput.value) : 1;
        
        try {
            const response = await fetch('/api/adicionar-ao-carrinho', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `produto_id=${produtoId}&quantidade=${quantidade}`
            });
            
            const data = await response.json();
            
            if (data.mensagem) {
                // Atualiza o contador do carrinho
                document.getElementById('cart-count').textContent = data.total_itens;
                alert(data.mensagem); // Feedback simples
            }
        } catch (error) {
            console.error('Erro ao adicionar ao carrinho:', error);
            alert('Erro ao adicionar produto. Verifique o console.');
        }
    }
    </script>
</body>
</html>
